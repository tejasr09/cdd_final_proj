name: CI

on:
  push:
    branches:
      - feature/delivery-build
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.13.7

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm test -- --run --pool=forks --maxWorkers=1
          npm run build

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Check backend
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migrations.sqlite3
        run: |
          uv run --locked ruff check app tests scripts
          uv run --locked ruff format --check app tests scripts
          uv run --locked pytest
          uv run --locked alembic upgrade head
          uv run --locked alembic check
          uv audit --locked

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build and start Compose stack
        run: docker compose --env-file .env.example up --build --detach --wait --wait-timeout 180

      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ripple-effect-api:local
          format: table
          vuln-type: os,library
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "1"

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ripple-effect-web:local
          format: table
          vuln-type: os,library
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "1"

      - name: Smoke-test Compose stack
        run: python backend/scripts/smoke_compose.py

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans
